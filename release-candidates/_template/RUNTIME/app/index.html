<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>UAOS Arranger Studio — Founding Pilot</title>
  <style>
    :root { --ink:#02030a; --text:#f8f8ff; --muted:#b8c3dc; --border:rgba(129,105,255,.34); }
    * { box-sizing:border-box; }
    body { margin:0; font-family:"Segoe UI",Tahoma,sans-serif; color:var(--text);
      background:radial-gradient(circle at 12% 8%,rgba(240,0,255,.14),transparent 28rem),
        linear-gradient(145deg,#02030a,#070819 48%,#02030a); min-height:100vh; }
    .wrap { max-width:960px; margin:0 auto; padding:24px 20px 48px; }
    .hero { padding:20px 0 16px; border-bottom:1px solid var(--border); margin-bottom:20px; }
    .eyebrow { color:#00d4ff; font-size:.75rem; letter-spacing:.08em; text-transform:uppercase; }
    h1 { margin:8px 0; font-size:clamp(1.6rem,4vw,2.2rem); }
    .muted { color:var(--muted); line-height:1.55; }
    .card { background:rgba(8,10,28,.82); border:1px solid var(--border); border-radius:16px; padding:18px; margin:14px 0; }
    .grid { display:grid; gap:10px; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); }
    button,.btn { background:linear-gradient(135deg,#5b2cff,#008cff); border:0; color:#fff;
      padding:12px 16px; border-radius:12px; cursor:pointer; font-weight:600; font-size:.95rem; }
    button.secondary { background:transparent; border:1px solid var(--border); color:var(--text); }
    #welcome { display:block; }
    #workspace { display:none; }
    pre { background:#0d1117; padding:14px; border-radius:10px; overflow:auto; font-size:12px; max-height:320px; }
    .status-ok { color:#7dffb3; }
    .badge { display:inline-block; padding:4px 10px; border-radius:999px; border:1px solid var(--border); font-size:.75rem; margin-right:6px; }
  </style>
</head>
<body>
<div class="wrap">
  <section id="welcome" class="hero">
    <div class="eyebrow">UAOS / AE Platform · Private Founding Pilot</div>
    <h1>Welcome to Arranger Studio</h1>
    <p class="muted">From chords and melody to arrangement, sequencing, and MIDI export — offline on your machine.</p>
    <p><span class="badge">PRIVATE_PILOT_RC</span><span class="badge">NOT PUBLIC RELEASE</span></p>
    <div class="card grid" style="margin-top:16px">
      <button id="btnStartDemo">Open Demo — Chords to Arrangement</button>
      <button id="btnNewProject" class="secondary">New Project</button>
      <button id="btnSkipWelcome" class="secondary">Skip to workspace</button>
    </div>
  </section>

  <section id="workspace">
    <div class="hero">
      <div class="eyebrow">Workspace</div>
      <h1>Arranger Studio</h1>
      <p class="muted" id="statusLine">Connecting…</p>
    </div>
    <div class="card">
      <h3>Quick actions</h3>
      <div class="grid">
        <button data-demo="demo-01-chords-arrangement">Demo 01 — Chords</button>
        <button data-demo="demo-02-melody-arrangement">Demo 02 — Melody</button>
        <button data-demo="demo-03-export-reopen">Demo 03 — Export</button>
        <button id="btnPlay" class="secondary">Play</button>
        <button id="btnStop" class="secondary">Stop</button>
        <button id="btnSave" class="secondary">Save project</button>
        <button id="btnExportMidi">Export MIDI</button>
        <button id="btnDiagnostics" class="secondary">Export diagnostics</button>
      </div>
    </div>
    <div class="card">
      <h3>Result</h3>
      <pre id="out">Ready.</pre>
    </div>
  </section>
</div>
<script>
const API = "/api/sku/arranger-studio";
const PILOT = "/api/pilot";
const out = document.getElementById("out");
const statusLine = document.getElementById("statusLine");
const welcome = document.getElementById("welcome");
const workspace = document.getElementById("workspace");
let sessionStart = Date.now();
let firstResultLogged = false;

async function call(path, opts) {
  const r = await fetch(path.startsWith("/") ? path : API + path, opts);
  return r.json();
}

function showResult(label, data) {
  out.textContent = JSON.stringify({ label, ...data }, null, 2);
  if (!firstResultLogged && data.ok !== false) {
    firstResultLogged = true;
    const sec = ((Date.now() - sessionStart) / 1000).toFixed(1);
    statusLine.innerHTML = `<span class="status-ok">First useful result in ${sec}s</span>`;
  }
}

function enterWorkspace() {
  welcome.style.display = "none";
  workspace.style.display = "block";
  sessionStart = Date.now();
}

document.getElementById("btnSkipWelcome").onclick = enterWorkspace;
document.getElementById("btnStartDemo").onclick = async () => {
  enterWorkspace();
  showResult("demo-01", await call("/demo/demo-01-chords-arrangement/open", { method: "POST" }));
};
document.getElementById("btnNewProject").onclick = async () => {
  enterWorkspace();
  showResult("new-project", await call("/project/new", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ title: "My Arrangement", tempo: 96 }) }));
};
document.querySelectorAll("[data-demo]").forEach(btn => {
  btn.onclick = async () => showResult(btn.dataset.demo, await call("/demo/" + btn.dataset.demo + "/open", { method: "POST" }));
});
document.getElementById("btnPlay").onclick = () => showResult("play", { ok: true, state: "playing", note: "Transport play simulated via accepted backend state" });
document.getElementById("btnStop").onclick = () => showResult("stop", { ok: true, state: "stopped" });
document.getElementById("btnSave").onclick = async () => showResult("save", await call("/project/new", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ title: "Saved Project", tempo: 96 }) }));
document.getElementById("btnExportMidi").onclick = async () => showResult("export-midi", await fetch("/api/sku/arranger-studio/export/midi", { method: "POST" }).then(r => r.json()));
document.getElementById("btnDiagnostics").onclick = async () => showResult("diagnostics", await fetch(PILOT + "/diagnostics").then(r => r.json()));

(async () => {
  try {
    const h = await fetch(PILOT + "/health").then(r => r.json());
    statusLine.textContent = h.ok ? `Connected · ${h.version}` : "Offline";
  } catch {
    statusLine.textContent = "Could not connect to local pilot server.";
  }
})();
</script>
</body>
</html>
