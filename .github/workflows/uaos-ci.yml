name: UAOS CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: uaos-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install root dependencies if needed
        run: npm install

      - name: AI Factory safety check
        run: npm run ai:factory:check

      - name: Test if available
        run: npm test --if-present

      - name: Build web app if package exists
        shell: bash
        run: |
          if [ -f uaos-live-clean/package.json ]; then
            npm run build --prefix uaos-live-clean
          else
            echo "uaos-live-clean/package.json not found; skipping web app build."
          fi
