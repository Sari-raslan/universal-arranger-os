<!doctype html>
<html>
<head>
<meta charset="UTF-8"/>
<title>UAOS HyperStation</title>
<style>
body{margin:0;background:#05050d;color:#fff;font-family:Segoe UI,Arial;padding:28px}
.hero,.card{background:#121225;border:1px solid #38386c;border-radius:20px;padding:22px;margin:12px 0}
h1{font-size:42px;margin:0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}
button,select,input{width:100%;padding:13px;margin:8px 0;border-radius:12px;border:1px solid #3c3c66;background:#09091a;color:white}
button{background:#5a48ff;border:0;font-weight:700;cursor:pointer}
pre{background:#05050e;padding:14px;border-radius:12px;white-space:pre-wrap;max-height:420px;overflow:auto}
.badges span{display:inline-block;background:#252555;padding:7px 11px;border-radius:999px;margin:5px}
#logs div{border-bottom:1px solid #33335f;padding:7px}
</style>
</head>
<body>
<div id="app"></div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
