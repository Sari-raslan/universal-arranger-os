<!doctype html>
<html>
<head>
<meta charset="UTF-8"/>
<title>UAOS HyperStation V5</title>
<style>
body{margin:0;background:#080814;color:white;font-family:Segoe UI,Arial;padding:28px}
.hero,.card{background:#121228;border:1px solid #303060;border-radius:20px;padding:22px;margin:14px 0}
h1{font-size:42px;margin:0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
select,input,button{width:100%;padding:12px;margin:8px 0;border-radius:12px;border:1px solid #444;background:#09091a;color:white}
button{background:#5a48ff;font-weight:bold;cursor:pointer}
pre{background:#050510;padding:14px;border-radius:12px;white-space:pre-wrap;max-height:380px;overflow:auto}
</style>
</head>
<body>
<div class="hero">
<h1>UAOS HyperStation V5</h1>
<p>Real Audio Foundation • MIDI Export • Style Arranger • Oriental/Gulf Engine</p>
</div>

<div class="grid">
<div class="card">
<h2>Arranger</h2>
<label>Section</label>
<select id="section"><option>Intro</option><option selected>Main A</option><option>Main B</option><option>Main C</option><option>Main D</option><option>Fill</option><option>Break</option><option>Ending</option></select>
<label>Chord</label>
<select id="chord"><option>Cm</option><option>Dm</option><option>G7</option><option>F</option><option>Bb</option><option>Am</option></select>
<label>Maqam</label>
<select id="maqam"><option>Nahawand</option><option>Bayati</option><option>Hijaz</option><option>Rast</option><option>Saba</option><option>Kurd</option></select>
<label>Tempo</label>
<input id="tempo" type="range" min="60" max="160" value="96"/>
<button onclick="gen()">Generate Pattern</button>
<button onclick="play()">Play Audio</button>
<button onclick="mid()">Export MIDI</button>
</div>

<div class="card">
<h2>Status</h2>
<pre id="status"></pre>
</div>

<div class="card">
<h2>Libraries</h2>
<pre id="sounds"></pre>
</div>

<div class="card">
<h2>Pattern JSON</h2>
<pre id="out"></pre>
</div>
</div>

<script type="module" src="/src/main.js"></script>
</body>
</html>
