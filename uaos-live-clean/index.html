<!doctype html>
<html>
<head>
<meta charset="UTF-8"/>
<title>UAOS HyperStation V11 Final Local</title>
<style>
body{margin:0;background:#05050d;color:#fff;font-family:Segoe UI,Arial;padding:26px}
.hero,.card{background:#121225;border:1px solid #38386c;border-radius:20px;padding:20px;margin:12px 0}
h1{font-size:44px;margin:0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}
select,input,textarea,button{width:100%;box-sizing:border-box;padding:11px;margin:7px 0;border-radius:12px;border:1px solid #444;background:#09091a;color:white}
button{background:#5a48ff;font-weight:700;cursor:pointer}
pre,textarea{background:#05050e;white-space:pre-wrap;max-height:390px;overflow:auto}
.badge{display:inline-block;background:#242452;padding:8px 12px;border-radius:999px;margin:4px}
</style>
</head>
<body>
<div class="hero">
<h1>UAOS HyperStation V11</h1>
<p>Final Local Foundation ? Arranger ? MIDI Export ? Sampler Map ? WAV Import ? QA ? Release Kit</p>
<span class="badge">V11</span><span class="badge">Master Launcher</span><span class="badge">AEPlatform</span>
</div>
<div class="grid">
<div class="card">
<h2>Song Builder</h2>
<input id="projectName" value="UAOS V11 Final Demo"/>
<select id="presetSel" onchange="applyPreset()"></select>
<input id="tempo" type="range" min="60" max="160" value="96"/>
<select id="maqam"><option>Nahawand</option><option>Bayati</option><option>Hijaz</option><option>Rast</option><option>Saba</option><option>Kurd</option><option>Ajam</option></select>
<input id="progression" value="Cm F G7 Cm"/>
<textarea id="structure" rows="4">Intro,Main A,Main A,Fill,Main B,Break,Main A,Ending</textarea>
<button onclick="generate()">Generate</button>
<button onclick="play()">Play</button>
<button onclick="exportMidi()">Export MIDI</button>
<button onclick="saveProject()">Save Project</button>
<button onclick="downloadReport()">Download Report</button>
</div>
<div class="card"><h2>Sampler Map</h2><textarea id="map" rows="14"></textarea><button onclick="saveMap()">Save Map</button><input id="wav" type="file" accept=".wav"/><button onclick="importWav()">Import WAV</button></div>
<div class="card"><h2>Release Report</h2><pre id="report"></pre></div>
<div class="card"><h2>Checklist</h2><pre id="checklist"></pre></div>
<div class="card"><h2>Domain</h2><pre id="domain"></pre></div>
<div class="card"><h2>Sample Policy</h2><pre id="policy"></pre></div>
<div class="card"><h2>Routes</h2><pre id="routes"></pre></div>
<div class="card"><h2>MIDI Monitor</h2><pre id="monitor"></pre></div>
<div class="card"><h2>Song JSON</h2><pre id="out"></pre></div>
<div class="card"><h2>Status</h2><pre id="status"></pre></div>
<div class="card"><h2>Projects</h2><pre id="projects"></pre></div>
<div class="card"><h2>Log</h2><div id="logs"></div></div>
</div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
