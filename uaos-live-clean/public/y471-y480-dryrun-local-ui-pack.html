<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>UAOS Y471-Y480 Dry-run Local UI Pack</title>
  <style>
    body{font-family:Arial;background:#101010;color:#eee;padding:28px;line-height:1.5}
    .hero{padding:24px;border-radius:16px;background:#181818;border:1px solid #444;margin-bottom:18px}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
    .card{background:#1b1b1b;border:1px solid #444;border-radius:14px;padding:18px}
    .pass{color:#80ffb0}.lock{color:#ffcc66}.bad{color:#ff8080}code{color:#9fe870}
  </style>
</head>
<body>
  <div class="hero">
    <h1>UAOS Dry-run Local UI Pack</h1>
    <p>Local UI pages for viewing dry-run writer manifests safely.</p>
  </div>

  <div class="grid">
    <div class="card pass"><h3>Dry-run Manifests</h3><p>JSON only.</p></div>
    <div class="card pass"><h3>Viewer</h3><p>Local HTML only.</p></div>
    <div class="card lock"><h3>Real Writer</h3><p>BLOCKED.</p></div>
    <div class="card lock"><h3>Real Keyboard Output</h3><p>BLOCKED.</p></div>
    <div class="card lock"><h3>Deploy</h3><p>BLOCKED.</p></div>
  </div>
</body>
</html>
