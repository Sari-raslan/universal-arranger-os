<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UAOS Yamaha Side Agents Prewrite Dashboard</title>
  <style>
    body { margin:0; font-family:Arial, sans-serif; background:#070b14; color:#eef4ff; }
    main { max-width:1000px; margin:0 auto; padding:32px; }
    .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:16px; margin-top:24px; }
    .card { background:#101827; border:1px solid #26354f; border-radius:18px; padding:20px; }
    .pass { color:#7CFC98; font-weight:bold; }
    .warn { color:#facc15; font-weight:bold; }
    code { background:#030712; padding:3px 6px; border-radius:6px; }
  </style>
</head>
<body>
  <main>
    <h1>UAOS Yamaha Side Agents Prewrite Dashboard</h1>
    <p class="pass">SIDE AGENT PLANS READY</p>
    <p class="warn">Implementation files are not written yet.</p>

    <div class="grid">
      <div class="card"><h2>Prefix Scanner Agent</h2><p class="warn">Pending approval</p></div>
      <div class="card"><h2>Marker Index Agent</h2><p class="warn">Pending approval</p></div>
      <div class="card"><h2>Full Parser Agent</h2><p class="warn">Locked</p></div>
      <div class="card"><h2>Writer Agent</h2><p class="warn">Hard locked</p></div>
      <div class="card"><h2>QA Agent</h2><p class="pass">Planning ready</p></div>
    </div>
  </main>
</body>
</html>
