<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UAOS Real Writer Final Dashboard</title>
  <style>
    body { margin:0; font-family:Arial, sans-serif; background:#070b14; color:#eef4ff; }
    main { max-width:1000px; margin:0 auto; padding:32px; }
    .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:16px; margin-top:24px; }
    .card { background:#101827; border:1px solid #26354f; border-radius:18px; padding:20px; }
    .pass { color:#7CFC98; font-weight:bold; }
    .warn { color:#facc15; font-weight:bold; }
    code { background:#030712; padding:3px 6px; border-radius:6px; }
  </style>
</head>
<body>
  <main>
    <h1>UAOS Real Writer Final Dashboard</h1>
    <p class="pass">SAFE BASELINE CLOSED</p>

    <div class="grid">
      <div class="card"><h2>Target</h2><p>Yamaha <code>.STY</code> first</p></div>
      <div class="card"><h2>Parser</h2><p class="warn">Planning only</p></div>
      <div class="card"><h2>Writer</h2><p class="warn">Locked</p></div>
      <div class="card"><h2>Deploy</h2><p class="warn">Not executed</p></div>
    </div>

    <div class="card">
      <h2>Allowed now</h2>
      <p>Metadata indexing, read-only prefix analysis, safe reports.</p>
    </div>

    <div class="card">
      <h2>Blocked</h2>
      <p><code>.STY</code>, <code>.SET</code>, <code>.PRS</code>, <code>.STL</code>, <code>.PAT</code>, <code>.MSP</code>, <code>.KST</code> real writing.</p>
    </div>
  </main>
</body>
</html>
