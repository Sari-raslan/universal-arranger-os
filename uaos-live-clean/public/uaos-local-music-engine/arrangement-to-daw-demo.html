<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>UAOS Arrangement to DAW Demo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body{font-family:Arial,sans-serif;background:#08101f;color:#f4f7ff;margin:0;padding:24px}
    .card{background:#131d35;border:1px solid #2c3a66;border-radius:18px;padding:18px;margin:14px 0}
    button{padding:10px 14px;border:0;border-radius:10px;cursor:pointer;margin-right:8px}
    pre{white-space:pre-wrap;background:#050a14;border-radius:12px;padding:14px}
    a{color:#9bdcff}
  </style>
</head>
<body>
  <h1>UAOS Arrangement → DAW Demo</h1>
  <p>Converts placeholder arrangement into UAOS DAW JSON only.</p>

  <div class="card">
    <button onclick="convertDemo()">Convert Demo</button>
    <pre id="out">Ready.</pre>
  </div>

  <p><a href="./index.html">Back</a></p>

  <script>
    function convertDemo(){
      const arrangement = {
        format: "UAOS_ARRANGEMENT_PROJECT",
        title: "Oriental Pop Placeholder",
        tempo: 96,
        timeSignature: "4/4",
        sections: [
          {
            sectionId: "intro",
            name: "Intro",
            startBar: 1,
            bars: 4,
            chords: ["Dm","Bb","C","Dm"],
            styleLanes: {
              drums: [{bar:1,pattern:"placeholder"}],
              bass: [{bar:1,pattern:"placeholder"}],
              chords: [{bar:1,pattern:"placeholder"}],
              pads: [{bar:1,pattern:"placeholder"}],
              melody: [{bar:1,pattern:"placeholder"}]
            }
          }
        ]
      };

      const daw = {
        format: "UAOS_DAW_PROJECT",
        version: "1.0.0-local-bridge",
        title: arrangement.title + " - DAW Bridge",
        tempo: arrangement.tempo,
        timeSignature: arrangement.timeSignature,
        tracks: ["drums","bass","chords","pads","melody"].map(function(lane){
          return {
            trackId: "track-" + lane,
            name: lane + " placeholder",
            type: "placeholder",
            clips: arrangement.sections.map(function(section){
              return {
                clipId: lane + "-" + section.sectionId,
                type: "midi-placeholder",
                sectionName: section.name,
                bars: section.bars,
                chords: section.chords,
                events: section.styleLanes[lane] || []
              };
            })
          };
        }),
        bridgeSafety: {
          localJsonOnly: true,
          noKeyboardFileWriter: true,
          noHardwareOutput: true,
          noProductionParser: true
        }
      };

      document.getElementById("out").textContent = JSON.stringify(daw, null, 2);
    }
  </script>
</body>
</html>
