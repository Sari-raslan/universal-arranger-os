<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>UAOS Acceleration Factory Dashboard</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 32px; color: #202124; background: #f6f6f3; }
    main { max-width: 980px; margin: 0 auto; }
    table { width: 100%; border-collapse: collapse; background: #fff; }
    th, td { border: 1px solid #d7d7d0; padding: 10px; text-align: left; }
    th { background: #ecebe4; }
    .yes { color: #1f6b3b; font-weight: 700; }
    .no { color: #7a1f1f; font-weight: 700; }
  </style>
</head>
<body>
<main>
  <h1>UAOS Acceleration Factory Dashboard</h1>
  <p>status: DRAFT_NOT_RUN</p>
  <table>
    <tr><th>Check</th><th>Status</th></tr>
    <tr><td>V61-V90 drafts created</td><td class="yes">YES</td></tr>
    <tr><td>Future versions executed</td><td class="no">NO</td></tr>
    <tr><td>Future versions marked PASS</td><td class="no">NO</td></tr>
    <tr><td>Export allowed</td><td class="no">NO</td></tr>
    <tr><td>KORG output</td><td class="no">NO</td></tr>
    <tr><td>App.jsx touched</td><td class="no">NO</td></tr>
    <tr><td>Deploy/payment</td><td class="no">NO</td></tr>
  </table>
</main>
</body>
</html>
