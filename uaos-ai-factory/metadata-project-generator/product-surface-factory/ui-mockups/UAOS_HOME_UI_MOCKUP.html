<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>UAOS Home UI Mockup</title>
  <style>
    body { margin: 0; font-family: Arial, sans-serif; background: #f5f5f1; color: #202124; }
    main { max-width: 1120px; margin: 0 auto; padding: 32px; }
    .bar, .panel { background: #fff; border: 1px solid #d8d8d0; border-radius: 8px; padding: 18px; margin: 16px 0; }
    nav { display: flex; gap: 10px; flex-wrap: wrap; }
    button { border: 1px solid #9aa0a6; background: #eef1f4; padding: 10px 14px; border-radius: 6px; }
  </style>
</head>
<body>
<main>
  <section class="bar">
    <h1>UAOS Local Metadata Program</h1>
    <p>DRAFT_ONLY static local mockup. No backend, no React, no export output.</p>
    <nav>
      <button>Project Metadata</button><button>Style Planner</button><button>Owner Review</button><button>QA Dashboard</button><button>Export: Blocked / Research Only</button>
    </nav>
  </section>
  <section class="panel"><h2>Current State</h2><p>All presentation surfaces are local planning drafts.</p></section>
</main>
</body>
</html>
