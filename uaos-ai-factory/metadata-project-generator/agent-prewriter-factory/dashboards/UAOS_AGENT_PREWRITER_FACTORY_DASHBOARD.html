<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>UAOS Agent Prewriter Factory Dashboard</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 32px; color: #1d1f23; background: #f7f7f5; }
    main { max-width: 980px; margin: 0 auto; }
    h1 { font-size: 28px; margin-bottom: 8px; }
    table { width: 100%; border-collapse: collapse; background: #ffffff; }
    th, td { border: 1px solid #d8d8d2; padding: 10px; text-align: left; }
    th { background: #ecebe4; }
    .no { color: #7a1f1f; font-weight: 700; }
    .yes { color: #1f6b3b; font-weight: 700; }
  </style>
</head>
<body>
<main>
  <h1>UAOS Agent Prewriter Factory Dashboard</h1>
  <p>Status: metadata-only draft queue for V62-V70. future_version_status: "DRAFT_NOT_RUN"</p>
  <table>
    <tr><th>Check</th><th>Status</th></tr>
    <tr><td>Draft-only</td><td class="yes">YES</td></tr>
    <tr><td>Metadata-only</td><td class="yes">YES</td></tr>
    <tr><td>Future versions executed</td><td class="no">NO</td></tr>
    <tr><td>Future versions marked complete</td><td class="no">NO</td></tr>
    <tr><td>Export allowed</td><td class="no">NO</td></tr>
    <tr><td>KORG output</td><td class="no">NO</td></tr>
    <tr><td>App.jsx touched</td><td class="no">NO</td></tr>
    <tr><td>Deploy/payment</td><td class="no">NO</td></tr>
  </table>
</main>
</body>
</html>
