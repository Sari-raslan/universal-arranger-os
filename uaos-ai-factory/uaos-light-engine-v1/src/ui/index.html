<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>UAOS Light Engine V10 Ambient Magic</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box}
body{margin:0;background:#17130f;color:#fff7ed;font-family:Segoe UI,Tahoma,Arial,sans-serif;padding:24px}
.wrap{max-width:960px;margin:0 auto}
.tile{border:1px solid rgba(251,191,36,.28);border-radius:8px;background:#241b14;padding:22px}
h1{margin:0;font-size:34px}
p{color:#d8c4aa;font-size:18px;margin:8px 0 18px}
.buttons{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
button,a{display:flex;align-items:center;justify-content:center;min-height:58px;border:1px solid rgba(251,191,36,.28);border-radius:8px;background:#8a4b1f;color:#fffaf0;font:inherit;font-weight:800;text-decoration:none;cursor:pointer}
.off{background:#221f1b}.danger{background:#9f1d1d}
.note{margin-top:16px;font-size:14px;color:#c7b08f}
</style>
</head>
<body>
<main class="wrap">
  <section class="tile">
    <h1>UAOS Light Engine V10 Ambient Magic</h1>
    <p>Candle · Fireplace · Lantern · Warm Moving Lights · Real Hue</p>
    <div class="buttons">
      <a href="/src/ui/v10/index.html">Open Ambient Magic</a>
      <button onclick="runAmbient('candle')">Run Candle</button>
      <button onclick="runAmbient('fireplace')">Run Fireplace</button>
      <button onclick="runAmbient('lantern')">Run Lantern</button>
      <button class="off" onclick="post('/api/v5/lights/off',{})">Turn Off</button>
      <button class="danger" onclick="post('/api/v4/emergency-stop',{})">Emergency Stop</button>
    </div>
    <div class="note">Local only · WLED gated · DMX gated · V5 fallback preserved</div>
  </section>
</main>
<script>
async function post(path, body){
  await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body||{})});
}
async function runAmbient(effectId){
  await post('/api/v10/ambient/run',{effectId,speed:'slow',intensity:0.45,warmth:0.85,motion:0.35,room:'full'});
}
</script>
</body>
</html>
